name: Rust

on:
  pull_request:
  push:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install external check tools
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-machete@0.9.2,cargo-audit@0.22.2,cargo-nextest@0.9.145
      - name: Install Lockpick
        run: cargo install --git https://github.com/Kuenlun/lockpick --rev d611414b8676d5bf2b3b97ee4484a082b8749634 --locked lockpick
      - name: Run checks
        run: lockpick -v

      - name: Generate LCOV report from cached profdata
        if: runner.os == 'Linux'
        run: cargo llvm-cov report --branch --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: lcov.info
          version: v11.3.1
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  merge-gate:
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "::error::Check failed: ${{ needs.check.result }}"
            exit 1
          fi
