name: Rust

on:
  pull_request:
  push:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install external check tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-machete,cargo-audit,cargo-nextest
      - name: Install Lockpick
        run: cargo install --git https://github.com/Kuenlun/lockpick --rev d611414b8676d5bf2b3b97ee4484a082b8749634 --locked lockpick
      - name: Run checks
        run: lockpick -v

      - name: Generate LCOV report from cached profdata
        if: runner.os == 'Linux'
        run: cargo llvm-cov report --branch --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  merge-gate:
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "::error::Check failed: ${{ needs.check.result }}"
            exit 1
          fi
